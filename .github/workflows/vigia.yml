name: Vigia cupos Registro Civil

on:
  # Sin schedule: el cron de GitHub corre cada 2-5 horas y duplicaba la tarea
  # local. Solo corre cuando lo dispara cron-job.org (workflow_dispatch por la
  # API) o a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      test:
        description: "Solo mandar un mensaje de prueba a Telegram (--test)"
        type: boolean
        default: false

permissions:
  contents: write

# Si una corrida se atrasa y se pisa con la siguiente, que no corran juntas:
# las dos leerían el mismo estado.json y podrían avisar dos veces.
concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Acciones fijadas por SHA (no por tag, que puede moverse).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # --require-hashes: pip rechaza cualquier archivo que no coincida con los
      # hashes de requirements.txt. Este paso ve los secrets, así que acá no se
      # instala pytest ni nada que no use el vigía.
      - name: Instalar dependencias
        run: pip install --require-hashes -r requirements.txt

      - name: Revisar agendas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          VIGIA_ESTADO: estado-nube.json
        run: python vigia.py ${{ inputs.test && '--test' || '' }}

      # Solo se commitea si cambió el estado (aparecen o se van los cupos), no
      # cada 5 minutos. Sin esto, cada corrida arrancaría de cero y avisaría
      # otra vez por los mismos cupos.
      - name: Guardar estado-nube.json si cambió
        run: |
          git add estado-nube.json
          if ! git diff --cached --quiet; then
            git config user.name "vigia-registro-civil"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: actualizar estado del vigía [skip ci]"
            git push
          fi
